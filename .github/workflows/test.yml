name: test

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: anonset-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  local-gates:
    name: local quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 24, cache: npm }
      - run: ./scripts/install-swissledger-toolchain
      - run: npm ci
      - name: Complete local quality gate
        run: make test

  testnet:
    name: fresh testnet deployment and ZK smoke
    needs: local-gates
    # Fork PRs never receive the Environment. Same-repository PRs targeting
    # main may be approved by the protected Environment for fresh testnet
    # validation, but remain ineligible for the main-only release workflow.
    if: >-
      ((github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.ref == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: swissledger-testnet
    permissions:
      contents: read
    concurrency:
      group: swissledger-testnet-deployer-222
      cancel-in-progress: false
    env:
      SWISSLEDGER_TESTNET_RPC: ${{ vars.SWISSLEDGER_TESTNET_RPC }}
      SWISSLEDGER_TESTNET_ADDRESS: ${{ vars.SWISSLEDGER_TESTNET_ADDRESS }}
      SWISSLEDGER_TESTNET_DEPLOY: ${{ secrets.SWISSLEDGER_TESTNET_DEPLOY }}
      SWISSLEDGER_TESTNET_CHAIN_ID: '222'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 24, cache: npm }
      - run: ./scripts/install-swissledger-toolchain
      - run: npm ci
      - run: node scripts/generate-build-info.mjs
      - name: Normalize mandatory JSON-RPC params
        run: |
          test -n "$SWISSLEDGER_TESTNET_RPC" || { echo 'missing org variable SWISSLEDGER_TESTNET_RPC' >&2; exit 1; }
          test -n "$SWISSLEDGER_TESTNET_ADDRESS" || { echo 'missing org variable SWISSLEDGER_TESTNET_ADDRESS' >&2; exit 1; }
          test -n "$SWISSLEDGER_TESTNET_DEPLOY" || { echo 'missing org secret SWISSLEDGER_TESTNET_DEPLOY' >&2; exit 1; }
          python3 scripts/rpc-proxy.py --target "$SWISSLEDGER_TESTNET_RPC" > rpc-proxy.log 2>&1 &
          echo 'SWISSLEDGER_TESTNET_RPC=http://127.0.0.1:8545' >> "$GITHUB_ENV"
          for _ in $(seq 1 30); do bin/swissledger-cast chain-id --rpc-url http://127.0.0.1:8545 && exit 0; sleep 1; done
          echo 'RPC params proxy did not become ready' >&2
          exit 1
      - name: Deploy a fresh stack
        run: ./scripts/testnet-deploy artifacts/testnet/deployment.json
      - name: Exercise proof semantics
        run: ./scripts/testnet-zk-smoke artifacts/testnet/deployment.json artifacts/testnet/smoke.json
      - name: Assemble secret-free evidence
        run: |
          make dependency-evidence
          node scripts/testnet-evidence.mjs artifacts/testnet/deployment.json artifacts/testnet/smoke.json artifacts/testnet/evidence
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: anonset-testnet-${{ github.sha }}
          path: artifacts/testnet/evidence
          if-no-files-found: error
          retention-days: 90

  validate-testnet-evidence:
    needs: testnet
    if: needs.testnet.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: anonset-testnet-${{ github.sha }}
          path: downloaded-evidence
      - name: Validate downloaded evidence is self-consistent and secret-free
        run: |
          node -e 'const fs=require("fs"),c=require("crypto");const d="downloaded-evidence",m=JSON.parse(fs.readFileSync(`${d}/manifest.json`));if(m.schema!==1||m.chainId!==222||!Array.isArray(m.contracts)||m.contracts.length!==3)throw Error("invalid manifest schema");for(const x of m.contracts){const a=JSON.parse(fs.readFileSync(`${d}/${x.name}.json`));if(c.createHash("sha256").update(JSON.stringify(a.abi)).digest("hex")!==x.abiSha256||c.createHash("sha256").update(a.bytecode.object).digest("hex")!==x.bytecodeSha256)throw Error("artifact hash mismatch");}'
          ! grep -RIE '(private.?key|mnemonic|github_token|x-access-token|https?://[^/@]+:[^/@]+@)' downloaded-evidence
