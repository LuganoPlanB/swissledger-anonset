name: test

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      # Source action reviewed at 7ac07c5731c9a768edcab2b8506047e4d9dc587c;
      # install explicit v1.11.0 assets with repository-pinned checksums.
      - run: ./scripts/install-swissledger-toolchain
      - run: npm ci
      - name: Complete local quality gate
        run: make test

  smoke:
    needs: unit
    runs-on: ubuntu-latest
    env:
      RPC_URL: ${{ secrets.SWISSLEDGER_TESTNET_ADDRESS }}
      PRIVATE_KEY: ${{ secrets.SWISSLEDGER_TESTNET_DEPLOY }}
      CHAIN_ID: 222
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: ./scripts/install-swissledger-toolchain
      - run: npm ci
      - run: node scripts/generate-build-info.mjs
      - run: bin/swissledger-forge build

      - name: Check secrets
        run: |
          if [ -z "$RPC_URL" ] || [ -z "$PRIVATE_KEY" ]; then
            echo "SKIP: testnet secrets not configured"
            exit 0
          fi

      - name: Deploy SemaphoreVerifier
        run: |
          bin/swissledger-forge create node_modules/@semaphore-protocol/contracts/base/SemaphoreVerifier.sol:SemaphoreVerifier \
            --rpc-url "$RPC_URL" --private-key "$PRIVATE_KEY" \
            --legacy --gas-price 0 --chain "$CHAIN_ID" \
            --broadcast --json > verifier.json
          echo "verifier=$(jq -r .deployedTo verifier.json)" >> "$GITHUB_OUTPUT"
        id: deploy-verifier

      - name: Deploy Semaphore
        run: |
          bin/swissledger-forge create node_modules/@semaphore-protocol/contracts/Semaphore.sol:Semaphore \
            --rpc-url "$RPC_URL" --private-key "$PRIVATE_KEY" \
            --legacy --gas-price 0 --chain "$CHAIN_ID" \
            --broadcast --json \
            --constructor-args "${{ steps.deploy-verifier.outputs.verifier }}" \
            > semaphore.json
          echo "semaphore=$(jq -r .deployedTo semaphore.json)" >> "$GITHUB_OUTPUT"
        id: deploy-semaphore

      - name: Deploy MerkleRootRegistryZK
        run: |
          bin/swissledger-forge create src/MerkleRootRegistryZK.sol:MerkleRootRegistryZK \
            --rpc-url "$RPC_URL" --private-key "$PRIVATE_KEY" \
            --legacy --gas-price 0 --chain "$CHAIN_ID" \
            --broadcast --json \
            --constructor-args "${{ steps.deploy-semaphore.outputs.semaphore }}" \
            > registry.json
          echo "registry=$(jq -r .deployedTo registry.json)" >> "$GITHUB_OUTPUT"
        id: deploy-registry

      - name: Smoke — add member and query state
        run: |
          if [ -z "$RPC_URL" ]; then echo "SKIP: no RPC"; exit 0; fi
          REGISTRY="${{ steps.deploy-registry.outputs.registry }}"

          COMMITMENT=11005642493773047649202648265396872197147567800455247120861783398111750817516
          bin/swissledger-cast send "$REGISTRY" "addMember(uint256)" "$COMMITMENT" \
            --rpc-url "$RPC_URL" --private-key "$PRIVATE_KEY" \
            --legacy --gas-price 0 --chain "$CHAIN_ID"

          COUNT=$(bin/swissledger-cast call "$REGISTRY" "memberCount()(uint256)" --rpc-url "$RPC_URL" --chain "$CHAIN_ID")
          ROOT=$(bin/swissledger-cast call "$REGISTRY" "activeRoot()(uint256)" --rpc-url "$RPC_URL" --chain "$CHAIN_ID")
          VERSION=$(bin/swissledger-cast call "$REGISTRY" "version()(string)" --rpc-url "$RPC_URL" --chain "$CHAIN_ID")

          echo "members:  $COUNT"
          echo "root:     $ROOT"
          echo "version:  $VERSION"

          test "$COUNT" != "0" || { echo "FAIL: empty group after addMember"; exit 1; }
          test "$ROOT"  != "0" || { echo "FAIL: zero root after addMember"; exit 1; }
          test -n "$VERSION"   || { echo "FAIL: no version string"; exit 1; }

          echo "PASS: on-chain smoke test"
