name: test

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with: { node-version: 24, cache: npm }
      - uses: LuganoPlanB/swissledger-foundry@main
      - run: npm ci
      - name: Fast tests
        if: github.event_name == 'pull_request'
        run: bash scripts/test.sh --ci
      - name: Full tests
        if: github.event_name != 'pull_request'
        run: bash scripts/test.sh --ci --full

  smoke:
    needs: unit
    runs-on: ubuntu-latest
    env:
      RPC_URL: ${{ vars.SWISSLEDGER_TESTNET_RPC }}
      PRIVATE_KEY: ${{ secrets.SWISSLEDGER_TESTNET_DEPLOY }}
      CHAIN_ID: 222
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with: { node-version: 24, cache: npm }
      - uses: LuganoPlanB/swissledger-foundry@main
      - run: npm ci
      - run: bash scripts/test.sh --ci --smoke
