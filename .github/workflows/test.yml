name: test

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with: { node-version: 24, cache: npm }
      - uses: LuganoPlanB/swissledger-foundry@main
      - run: npm ci
      - name: Generate build info
        run: |
          echo "=== generating BuildInfo..."
          node scripts/generate-build-info.mjs
      - name: Forge build
        run: |
          echo "=== forge build (compiling Solidity)..."
          forge build
      - name: Forge test (fast)
        if: github.event_name == 'pull_request'
        run: |
          echo "=== forge test (fast suite)..."
          forge test -vvv
      - name: Forge test (full)
        if: github.event_name != 'pull_request'
        run: |
          echo "=== forge test (full suite)..."
          cp test-slow/*.t.sol test/
          forge test -vvv
          rm test/MerkleRootRegistryZK.t.sol
      - name: Node client tests
        run: |
          echo "=== node client tests..."
          node --test clients/anonset/anonset.test.mjs

  smoke:
    needs: unit
    runs-on: ubuntu-latest
    env:
      RPC_URL: ${{ secrets.SWISSLEDGER_TESTNET_RPC }}
      PRIVATE_KEY: ${{ secrets.SWISSLEDGER_TESTNET_DEPLOY }}
      CHAIN_ID: 222
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Smoke job starting
        run: echo "=== smoke job: downloading toolchain + installing deps..."
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with: { node-version: 24, cache: npm }
      - uses: LuganoPlanB/swissledger-foundry@main
      - name: npm ci
        run: |
          echo "=== npm ci..."
          npm ci
      - name: Build info
        run: |
          echo "=== generating BuildInfo..."
          node scripts/generate-build-info.mjs
      - name: Forge build
        run: |
          echo "=== forge build (compiling Solidity, including Groth16)..."
          forge build

      - name: Check secrets
        run: |
          if [ -z "$RPC_URL" ] || [ -z "$PRIVATE_KEY" ]; then
            echo "SKIP: testnet secrets not configured"
            exit 0
          fi

      - name: Deploy SemaphoreVerifier
        run: |
          echo "=== compiling + deploying SemaphoreVerifier (Groth16, heavy)..."
          forge create node_modules/@semaphore-protocol/contracts/base/SemaphoreVerifier.sol:SemaphoreVerifier \
            --rpc-url "$RPC_URL" --private-key "$PRIVATE_KEY" \
            --legacy --gas-price 0 --chain "$CHAIN_ID" \
            --gas-limit 10000000 \
            --broadcast --json > verifier.json
          echo "verifier=$(jq -r .deployedTo verifier.json)" >> "$GITHUB_OUTPUT"
        id: deploy-verifier

      - name: Deploy Semaphore
        run: |
          echo "=== deploying Semaphore..."
          forge create node_modules/@semaphore-protocol/contracts/Semaphore.sol:Semaphore \
            --rpc-url "$RPC_URL" --private-key "$PRIVATE_KEY" \
            --legacy --gas-price 0 --chain "$CHAIN_ID" \
            --gas-limit 10000000 \
            --broadcast --json \
            --constructor-args "${{ steps.deploy-verifier.outputs.verifier }}" \
            > semaphore.json
          echo "semaphore=$(jq -r .deployedTo semaphore.json)" >> "$GITHUB_OUTPUT"
        id: deploy-semaphore

      - name: Deploy MerkleRootRegistryZK
        run: |
          echo "=== deploying MerkleRootRegistryZK..."
          forge create src/MerkleRootRegistryZK.sol:MerkleRootRegistryZK \
            --rpc-url "$RPC_URL" --private-key "$PRIVATE_KEY" \
            --legacy --gas-price 0 --chain "$CHAIN_ID" \
            --gas-limit 10000000 \
            --broadcast --json \
            --constructor-args "${{ steps.deploy-semaphore.outputs.semaphore }}" \
            > registry.json
          echo "registry=$(jq -r .deployedTo registry.json)" >> "$GITHUB_OUTPUT"
        id: deploy-registry

      - name: Smoke — add member and query state
        run: |
          echo "=== smoke: addMember + verify..."
          if [ -z "$RPC_URL" ]; then echo "SKIP: no RPC"; exit 0; fi
          REGISTRY="${{ steps.deploy-registry.outputs.registry }}"

          COMMITMENT=11005642493773047649202648265396872197147567800455247120861783398111750817516
          cast send "$REGISTRY" "addMember(uint256)" "$COMMITMENT" \
            --rpc-url "$RPC_URL" --private-key "$PRIVATE_KEY" \
            --legacy --gas-price 0 --chain "$CHAIN_ID" \
            --gas-limit 500000

          COUNT=$(cast call "$REGISTRY" "memberCount()(uint256)" --rpc-url "$RPC_URL" --chain "$CHAIN_ID")
          ROOT=$(cast call "$REGISTRY" "activeRoot()(uint256)" --rpc-url "$RPC_URL" --chain "$CHAIN_ID")
          VERSION=$(cast call "$REGISTRY" "version()(string)" --rpc-url "$RPC_URL" --chain "$CHAIN_ID")

          echo "members:  $COUNT"
          echo "root:     $ROOT"
          echo "version:  $VERSION"

          test "$COUNT" != "0" || { echo "FAIL: empty group after addMember"; exit 1; }
          test "$ROOT"  != "0" || { echo "FAIL: zero root after addMember"; exit 1; }
          test -n "$VERSION"   || { echo "FAIL: no version string"; exit 1; }

          echo "PASS: on-chain smoke test"
